name: Source software checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  software:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python scripts/verify.py --software-only
      - name: Report software test evidence
        run: |
          python -c "import json,xml.etree.ElementTree as E; r=E.parse('results/test-results.xml').getroot(); print('JUnit suites:',json.dumps([s.attrib for s in r.iter('testsuite')],sort_keys=True)); print('Package statement coverage:',json.dumps(json.load(open('results/coverage.json'))['totals'],sort_keys=True))"
      - run: python -m biog_reliability.cli examples/demo/truth.csv examples/demo/predictions.csv examples/demo/provenance.json --output work/demo
      - name: Verify packaged source independently
        run: |
          python -c "import pathlib,tarfile; p=next(pathlib.Path('dist').glob('*.tar.gz')); tarfile.open(p).extractall('work/package-smoke',filter='data')"
          python -m pip install --no-deps --no-build-isolation (Get-ChildItem dist/*.tar.gz).FullName
          python -m pytest work/package-smoke/biog_reliability-0.1.0/tests -m "not realdata"
      - run: python scripts/check_release.py
